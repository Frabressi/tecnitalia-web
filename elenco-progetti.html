<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivio Progetti | Tecnitalia Group</title>
    <meta name="description" content="Il portfolio dei progetti di Tecnitalia Group: bonifiche, gestione rifiuti, amianto e interventi ambientali realizzati in tutta Italia dal 1986.">
    <link rel="canonical" href="https://www.tecnitaliagroup.it/elenco-progetti.html">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="it_IT">
    <meta property="og:title" content="Archivio Progetti | Tecnitalia Group">
    <meta property="og:description" content="Dal 1986, i nostri principali interventi sul territorio nazionale.">
    <meta property="og:url" content="https://www.tecnitaliagroup.it/elenco-progetti.html">
    <meta property="og:image" content="https://www.tecnitaliagroup.it/assets/img/scavo.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="./assets/img/favicon-32.png">
    <link rel="icon" href="./assets/img/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="./assets/img/apple-touch-icon.png">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    <script defer type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Manrope:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div id="nav-placeholder"></div>

    <header class="page-header">
        <h1>Archivio Progetti</h1>
        <p style="font-size: 1.2rem;">Dal 1986, i nostri principali interventi sul territorio nazionale.</p>
    </header>

    <main class="page-content" style="max-width: 1200px;">
        <span class="eyebrow" style="text-align:center; display:block; margin-bottom:20px;">Il nostro lavoro</span>

        <div class="filter-container">
            <button class="filter-btn active" onclick="filterProjects('tutti', this)">Tutti i Progetti</button>
            <button class="filter-btn" onclick="filterProjects('bonifica', this)">Bonifiche</button>
            <button class="filter-btn" onclick="filterProjects('amianto', this)">Amianto / FAV</button>
            <button class="filter-btn" onclick="filterProjects('acque', this)">Acque / Falde</button>
            <button class="filter-btn" onclick="filterProjects('rifiuti', this)">Rifiuti / Discariche</button>
            <button class="filter-btn" onclick="filterProjects('demolizione', this)">Demolizioni / Decommissioning</button>
        </div>

        <div id="projects-grid-full" class="projects-full-grid"></div>

    </main>

    <div id="footer-placeholder"></div>

    <div class="modal" id="projectModal" role="dialog" aria-modal="true" aria-labelledby="m-title">
        <div class="modal-box">
            <button class="close-modal" onclick="closeProject()" aria-label="Chiudi scheda progetto">×</button>
            <div class="m-header">
                <div class="m-slides-wrapper" id="m-slides-wrapper"></div>
                <button class="m-img-btn prev" onclick="changeModalImg(-1)" id="m-btn-prev">&#10094;</button>
                <button class="m-img-btn next" onclick="changeModalImg(1)" id="m-btn-next">&#10095;</button>
            </div>
            <div class="m-scroll-content" data-lenis-prevent>
                <h2 id="m-title" style="margin-bottom:20px; font-size:2rem; line-height:1.2;"></h2>
                <div class="m-specs">
                    <div><strong>Committente</strong> <span id="m-client"></span></div>
                    <div><strong>Periodo</strong> <span id="m-period"></span></div>
                    <div><strong>Importo</strong> <span id="m-val"></span></div>
                    <div><strong>Attività</strong> <span id="m-type"></span></div>
                </div>
                <div id="m-desc" style="color:#333;"></div>
            </div>
        </div>
    </div>

    <script defer src="./js/main.js"></script>
</body>
</html>
